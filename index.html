<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg: #0c0c0c; --surf: #141414; --surf2: #1c1c1c; --border: rgba(255,255,255,0.07);
  --text: #e8e8e8; --muted: #555; --green: #27ae60; --r: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; }
#setup { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
#view { width: 400px; max-width: 90%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.bar { display: flex; justify-content: space-between; padding: 12px; background: var(--surf); border-bottom: 1px solid var(--border); }
.status { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surf2); border: 1px solid var(--border); }
.status.active { color: var(--green); border-color: rgba(39,174,96,0.3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; flex: 1; }
.v-container { position: relative; background: #000; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; aspect-ratio: 16/9; }
video { width: 100%; height: 100%; object-fit: cover; }
.controls { padding: 15px; display: flex; gap: 10px; }
.btn { padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surf2); color: #fff; cursor: pointer; }
.btn-primary { background: var(--text); color: #000; font-weight: 600; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 2000; }
.modal-box { background: var(--surf); padding: 30px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="setup">
  <div id="view"><video id="pVid" autoplay muted playsinline style="transform: scaleX(-1);"></video></div>
  <button class="btn btn-primary" id="startBtn">Connect</button>
</div>

<div class="bar">
  <span>Secure Session</span>
  <div id="stat" class="status">Disconnected</div>
</div>

<div class="grid">
  <div class="v-container"><video id="lVid" autoplay muted playsinline style="transform: scaleX(-1);"></video></div>
  <div class="v-container"><video id="rVid" autoplay playsinline></video></div>
</div>

<div class="controls">
  <button class="btn" onclick="copyURL()">Invite</button>
  <button class="btn" style="color:#ff6b6b" onclick="location.reload()">End</button>
</div>

<div class="modal" id="inModal">
  <div class="modal-box">
    <h3>Incoming Connection</h3>
    <button class="btn btn-primary" id="accBtn" style="margin-top:20px">Accept</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let peer, call, conn, stream;
window.pass = null;

const cfg = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
    iceTransportPolicy: 'all' 
};

async function init() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        $('pVid').srcObject = stream;
    } catch (e) {
        alert("Camera/Mic access required.");
    }
}

$('startBtn').onclick = () => {
    $('setup').style.display = 'none';
    $('lVid').srcObject = stream;
    run();
};

function run() {
    const id = Math.random().toString(36).substring(2, 12);
    peer = new Peer(id, { config: cfg });

    peer.on('open', uid => {
        const params = new URLSearchParams(location.search);
        const room = params.get('room');

        if (room) {
            const key = prompt("Access Key:");
            if (!key) return location.reload();
            conn = peer.connect(room);
            conn.on('open', () => {
                conn.send({ cmd: 'auth', val: key });
            });
            handleData(conn);
        } else {
            window.pass = Math.random().toString(36).slice(-6).toUpperCase();
            const newUrl = window.location.origin + window.location.pathname + '?room=' + uid;
            window.history.replaceState({}, '', newUrl);
            alert("Room Key: " + window.pass);
            updateStat("Key: " + window.pass, true);
        }
    });

    peer.on('connection', c => {
        c.on('data', data => {
            if (data.cmd === 'auth' && data.val === window.pass) {
                conn = c;
                updateStat("Verified", true);
                const out = peer.call(c.peer, stream);
                handleCall(out);
            } else if (data.cmd === 'auth') {
                c.send({ cmd: 'err', val: 'Denied' });
            }
        });
    });

    peer.on('call', inc => {
        if (conn && conn.open) {
            $('inModal').style.display = 'flex';
            $('accBtn').onclick = () => {
                $('inModal').style.display = 'none';
                inc.answer(stream);
                handleCall(inc);
            };
        }
    });
}

function handleCall(c) {
    call = c;
    call.on('stream', rem => {
        $('rVid').srcObject = rem;
        updateStat("Connected", true);
    });
}

function handleData(c) {
    c.on('data', d => {
        if (d.cmd === 'err') {
            alert(d.val);
            location.href = window.location.pathname;
        }
    });
}

function updateStat(t, a) {
    $('stat').textContent = t;
    $('stat').classList.toggle('active', a);
}

function copyURL() {
    navigator.clipboard.writeText(window.location.href);
}

window.onload = init;
</script>
</body>
</html>
